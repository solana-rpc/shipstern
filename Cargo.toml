[workspace]
members = ["crates/*", "examples/*", "tests/*"]
# proc-macro-events is excluded to avoid workspace feature unification:
# its `program-events` feature on the proc-macro crate would bleed into
# proc-macro-test, changing InstructionParser::Output from Instructions
# to ProgramEventOutput. Run its tests separately with:
#   cd tests/proc-macro-events && cargo test
exclude = [
  "examples/multi-dex-stream",
  "tests/idls",
  "tests/anchor-parity",
  "tests/proc-macro-events",
]
resolver = "2"

[workspace.package]
authors = ["Triton One", "ABK-Labs", "Jupiter Exchange"]
edition = "2024"
license = "MIT"
version = "0.11.0"
repository = "https://github.com/solana-rpc/shipstern"
publish = false

