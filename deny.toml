[graph]
all-features = true

[advisories]
ignore = [
    # atty is no longer maintained
    "RUSTSEC-2024-0375",

    # bincode 1.3.3 is unmaintained (solana transitive dep)
    "RUSTSEC-2025-0141",

    # unsafe-libyaml is unmaintained (serde_yaml via solana-cli-config and yellowstone-fumarole-client)
    "RUSTSEC-2024-0449",

    # curve25519-dalek vulnerability
    "RUSTSEC-2024-0344",

    # web-time not maintained
    "RUSTSEC-2024-0384",

    # derivative unmaintained warning
    "RUSTSEC-2024-0388",

    # ed25519-dalek 1.0.1
    "RUSTSEC-2022-0093",

    # ===== jetstreamer-firehose transitive dependencies =====
    # serde_cbor (direct dep of jetstreamer-firehose)
    "RUSTSEC-2021-0127",
    # Solana runtime crates pulled by jetstreamer-firehose:
    "RUSTSEC-2021-0139", # ansi_term
    "RUSTSEC-2025-0012", # backoff
    "RUSTSEC-2024-0421", # idna
    "RUSTSEC-2020-0016", # net2
    "RUSTSEC-2025-0119", # number_prefix
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile

    # rustls-webpki 0.101.7 is still carried by the legacy Solana/BigTable stack
    # (solana-storage-bigtable -> goauth 0.13 -> reqwest 0.11 -> rustls 0.21).
    # For this workspace we only use standard gRPC TLS client setup with native roots;
    # we do not assert URI SAN identities directly, so the URI-name-constraint issue is
    # low-risk here and requires certificate misissuance to exploit.
    "RUSTSEC-2026-0098",
    # Same legacy rustls 0.21 branch. Wildcard DNS name-constraint handling is carried
    # transitively by the old webpki line and is being tracked until upstream Solana
    # dependencies move off reqwest 0.11 / rustls 0.21.
    "RUSTSEC-2026-0099",
    # CRL parsing panic in rustls-webpki. This workspace does not configure or consume
    # certificate revocation lists directly; current TLS usage is standard gRPC client
    # setup with native roots, so the affected CRL parsing path is not used here.
    "RUSTSEC-2026-0104",
    # core2 is carried only by jetstreamer-firehose via cid/multihash. The crate is
    # unmaintained and yanked, but there is no safe upgrade path available on the
    # current dependency line; track until jetstreamer-firehose or its multiformats
    # stack moves off core2.
    "RUSTSEC-2026-0105",
    # libsecp256k1 is transitively pinned by the current Solana/Agave 3.1.x runtime
    # stack (and spl-stake-pool test path). Upstream recommends k256, but there is no
    # safe local upgrade without a broader Solana dependency move.
    "RUSTSEC-2025-0161",
    # proc-macro-error2 is pulled by solana-runtime 3.1.4 through aquamarine 0.6.0.
    # Both crates are already at the latest compatible releases; track until the
    # Solana/Agave runtime stack removes aquamarine or moves to a replacement.
    "RUSTSEC-2026-0173",
    # crypto-bigint 0.5.5 comes through k256 0.13 in solana-secp256k1-program 3.0.1
    # and solana-secp256k1-recover 3.3.0. The fix is only on 0.7 (>= 0.7.6).
    # secp256k1-program 3.1.1 and secp256k1-recover 3.3.1 move to k256 0.14, but
    # program 3.1.1 needs solana-signature ^3.6, and Agave 4.2.2 (solana-runtime,
    # solana-ledger) pins solana-signature below 3.5. Check again at the Agave 4.3
    # bump. Nothing in this workspace signs with secp256k1.
    "RUSTSEC-2026-0387",

    # zstd 0.13.3 and zstd-safe 7.3.0 come through Agave (agave-snapshots,
    # solana-storage-bigtable, solana-account-decoder and its client-types crate),
    # tonic and the workspace zstd ^0.13 pin. jetstreamer-firehose accepts any zstd
    # 0.x, so a lock update can move it to 0.13.3 too. Agave 4.3.2 still asks for
    # zstd ^0.13.3, and the fixes are only in zstd 0.14.3 and zstd-safe 8.2.0.
    # 0391: no crate here calls the zstd `with_context` constructors. 0398: the
    # `seekable` feature is off. 0403: every zstd decoder here, jetstreamer-firehose
    # included, is `stream::read::Decoder`, which the advisory lists as not affected.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]

[bans]
# 191 crates in this graph resolve to more than one version, nearly all of it from
# the Solana stack, so the duplicate report is noise. This section exists only for
# the explicit deny list below.
multiple-versions = "allow"
deny = [
    # Guards for the zstd and crypto-bigint ignores above. The zstd entries fail a
    # version below the fix on its line. The crypto-bigint entry fails all of 0.6,
    # which has no fix, and 0.7 below 0.7.6. The ranges match releases only, not
    # pre-releases.
    { name = "zstd", version = ">=0.14.0, <0.14.3", reason = "RUSTSEC-2026-0391: the 0.14 line must stay at or above 0.14.3" },
    { name = "zstd-safe", version = ">=8.0.0, <8.2.0", reason = "RUSTSEC-2026-0398 and RUSTSEC-2026-0403: the 8.x line must stay at or above 8.2.0" },
    { name = "crypto-bigint", version = ">=0.6.0, <0.7.6", reason = "RUSTSEC-2026-0387: 0.6 has no fix, and 0.7 must be 0.7.6 or later" },
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0", "MPL-2.0",
    "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "Unlicense", "OpenSSL",
    "CDLA-Permissive-2.0", "AGPL-3.0",
]
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
    { allow = ["ISC", "OpenSSL", "Apache-2.0"], crate = "aws-lc-sys" },
]
