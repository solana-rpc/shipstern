[graph]
all-features = true

[advisories]
ignore = [
    # bincode 1.3.3 is unmaintained (solana transitive dep)
    "RUSTSEC-2025-0141",

    # unsafe-libyaml is unmaintained (serde_yaml via solana-cli-config and yellowstone-fumarole-client)
    "RUSTSEC-2024-0449",

    # curve25519-dalek vulnerability
    "RUSTSEC-2024-0344",

    # derivative unmaintained warning
    "RUSTSEC-2024-0388",

    # ed25519-dalek 1.0.1
    "RUSTSEC-2022-0093",

    # ===== jetstreamer-firehose transitive dependencies =====
    # serde_cbor (direct dep of jetstreamer-firehose)
    "RUSTSEC-2021-0127",
    # Solana runtime crates pulled by jetstreamer-firehose:
    "RUSTSEC-2024-0436", # paste
    # libsecp256k1 is transitively pinned by the Solana/Agave runtime stack (and
    # spl-stake-pool test path). Upstream recommends k256, but there is no safe local
    # upgrade without a broader Solana dependency move.
    "RUSTSEC-2025-0161",
]

[bans]
# The Solana stack resolves many crates to more than one version, so the duplicate report is noise.
multiple-versions = "allow"

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0", "MPL-2.0",
    "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "Unlicense", "OpenSSL",
    "CDLA-Permissive-2.0", "AGPL-3.0",
]
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
    { allow = ["ISC", "OpenSSL", "Apache-2.0"], crate = "aws-lc-sys" },
]
