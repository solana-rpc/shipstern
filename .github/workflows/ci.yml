---
name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run on every PR, on merges to main, and manually via the Actions UI.
on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cache layout (restored by test, clippy, and test-events jobs):
#   ~/.cargo/registry  — downloaded crate sources (avoids re-downloading)
#   ~/.cargo/git       — git-based dependencies
#   target/debug/build — C/C++ build outputs (librdkafka cmake, ~2min to rebuild)
#   target/debug/.fingerprint — cargo's dep-tracking metadata
#   target/debug/deps  — compiled dependency .rlib files
#
# We skip target/debug/incremental (large, not useful across commits)
# and final binaries (rebuilt from cached deps in seconds).
#
# Key includes rust-toolchain.toml so the cache invalidates on compiler upgrades.

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-02-25
          components: rustfmt

      - name: cargo tree
        run: |
          cargo tree
          git checkout Cargo.lock
          cargo tree --frozen --offline

      - name: Run fmt
        run: cargo +nightly-2026-02-25 fmt --all -- --check

      - name: cargo deny check advisories bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans

  # The macro reads codama's node types directly, so the pin is a correctness
  # constraint, not hygiene: a second codama version in the graph type-checks and
  # then misparses IDLs. Each workspace resolves its own lockfile, so both are
  # checked. See .github/deny-codama.toml for the full rationale.
  codama-pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: codama-nodes is pinned to an exact version
        run: |
          grep -qE '^[[:space:]]*codama-nodes[[:space:]]*=.*"=[0-9]+\.[0-9]+\.[0-9]+"' Cargo.toml \
            || { echo "::error file=Cargo.toml::codama-nodes must use an exact pin (=X.Y.Z)"; exit 1; }

      # Both runs pass the deny config through `arguments`, not `command-arguments`:
      # cargo-deny 0.20 moved --config from `check` to the top level, and the action
      # appends `command-arguments` after the command's positional, where 0.20 rejects
      # it. The action is pinned to a tag rather than @v2 because it hardcodes its own
      # cargo-deny version, so a floating major can move the CLI out from under this
      # job -- which is how it broke the first time.
      - name: No duplicate codama versions (root workspace)
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features --config .github/deny-codama.toml
          command: check bans

      # Excluded from the root workspace, so it resolves its own lockfile and the
      # root cargo-deny run says nothing about it.
      - name: No duplicate codama versions (events workspace)
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: tests/proc-macro-events/Cargo.toml
          arguments: --all-features --config .github/deny-codama.toml
          command: check bans

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/registry/index/
            ~/.cargo/git/db/
            target/debug/build/
            target/debug/.fingerprint/
            target/debug/deps/
          key: cargo-build-v2-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-build-v2-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-build-v2-

      # Project toolchain + clippy are auto-installed from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang cmake libcurl4-openssl-dev libsasl2-dev

      - name: Run tests
        run: cargo test --workspace --lib --tests

      # wire_compat_tests is feature-gated, and the step above only reaches it
      # incidentally. Pin the features so the guard cannot drift.
      - name: Run protobuf wire-compat tests
        run: cargo test -p shipstern-proto --lib --features parser,stream

      - name: Run experimental account parser tests
        run: cargo test -p shipstern-kafka-sink --features experimental-account-parser --lib --tests

  test-events:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/registry/index/
            ~/.cargo/git/db/
            tests/proc-macro-events/target/debug/build/
            tests/proc-macro-events/target/debug/.fingerprint/
            tests/proc-macro-events/target/debug/deps/
          key: cargo-events-v2-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('tests/proc-macro-events/Cargo.lock') }}
          restore-keys: |
            cargo-events-v2-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-events-v2-

      # Project toolchain + clippy are auto-installed from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang cmake libcurl4-openssl-dev libsasl2-dev

      # Separate workspace to avoid feature unification issues with `program-events` feature
      - name: Run proc-macro-events tests
        run: cargo test --tests --manifest-path tests/proc-macro-events/Cargo.toml

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/registry/index/
            ~/.cargo/git/db/
            target/debug/build/
            target/debug/.fingerprint/
            target/debug/deps/
          key: cargo-build-v2-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-build-v2-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-build-v2-

      # Project toolchain + clippy are auto-installed from rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-dev libclang-dev clang cmake libcurl4-openssl-dev libsasl2-dev

      - name: Run clippy
        run: cargo clippy --all-targets --tests --no-deps --features shipstern-kafka-sink/experimental-account-parser -- -Dwarnings
