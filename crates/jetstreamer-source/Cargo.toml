[package]
name = "shipstern-jetstream-source"
version.workspace = true
description = "Jetstream source for Shipstern"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "./../../README.md"

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
shipstern = { workspace = true }
shipstern-core = { workspace = true }
yellowstone-grpc-proto = { workspace = true }
yellowstone-grpc-client = { workspace = true }
serde = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive", "cargo", "wrap_help"] }
thiserror = { workspace = true }
prost-types = { workspace = true }

jetstreamer-firehose = { workspace = true }
prometheus = { workspace = true, optional = true }

# Solana dependencies - upgraded to 4.2 with the main workspace
solana-transaction = { workspace = true }
solana-msg = { workspace = true }
solana-message = { workspace = true }
solana-instruction = { workspace = true }
solana-pubkey = { workspace = true }
solana-transaction-status = { workspace = true }
solana-runtime = { workspace = true }

# The proto's `TransactionError.err` is whatever agave's own storage-proto
# writes. That moved from bincode to wincode in 4.2, so this follows it.
wincode = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
solana-reward-info = "6"
solana-hash = { workspace = true }
# `solana_runtime::reward_info` is a private module in 4.2, so `RewardInfo` is
# unnameable. `StakeRewardInfo` is its only public constructor, via `From`.
solana-accounts-db = { workspace = true }
# Only used to assert that bincode does *not* produce V1 wire bytes; upstream
# documents V1 as incompatible with it and the test pins that.
bincode = { workspace = true }
solana-signature = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
prometheus = ["dep:prometheus"]
