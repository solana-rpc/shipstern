[package]
name = "proc-macro-test"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["serde"]
serde = ["dep:serde"]

# Workspace feature-unification workaround
#
# Inside this workspace, any workspace-wide command
# (`cargo check --workspace`, `cargo build`, `cargo test`) builds all crates
# in a shared dependency graph where Cargo unifies features: if *any* crate
# enables a feature, *all* crates see it enabled.
#
# The `#[shipstern]` proc-macro uses `cfg!(feature = "proto")` to decide whether
# to emit `#[derive(::prost::Message)]`.  Because proc-macros are compiled
# once for the whole workspace, enabling `shipstern-proc-macro/proto`
# from any crate (e.g. examples/prometheus) causes every `#[shipstern]` expansion
# to emit prost derives — even for parser crates whose own `proto` feature is
# off.
#
# Adding every parser here with `features = ["proto"]` ensures proto is
# activated on all of them during workspace builds, matching what the
# proc-macro emits.
#
# These must be [dependencies], not [dev-dependencies], because resolver v2
# does not unify dev-dependency features during `cargo check --workspace`.
[dependencies]
shipstern-spl-token-parser = { workspace = true, features = ["proto"] }
shipstern-spl-token-extensions-parser = { workspace = true, features = [
    "proto",
] }
shipstern-block-meta-parser = { workspace = true, features = ["proto"] }
shipstern-stake-pool-parser = { workspace = true, features = ["proto"] }

serde = { workspace = true, optional = true }

[dev-dependencies]
shipstern-proc-macro = { workspace = true, features = ["proto"] }
shipstern-mock = { workspace = true }
shipstern-test-utils = { path = "../common" }

# required by macro expansion
shipstern-parser = { workspace = true }
shipstern-core = { workspace = true, features = ["proto"] }
shipstern = { workspace = true }

prost = { workspace = true }
borsh = { workspace = true }
hex = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

regex = { workspace = true }

insta = "1.46.3"

# Used by the squads_multisig_program test to decode against the schema
# string directly (mirrors what a Schema-Registry consumer does).
prost-reflect = "0.16"
protox-parse = "0.9"

serde_json = { workspace = true }
